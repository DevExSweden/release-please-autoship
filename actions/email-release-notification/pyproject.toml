[project]
name = "email-release-notification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["--tb=short", "-q"]

[tool.coverage.run]
source = ["mailer"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
