name: "Copilot Release Notes"
description: "Generate release notes with GitHub Copilot, upload them as an artifact, and post a Slack link."

inputs:
  target-name:
    description: "Name of the target (e.g. sitoo, varner)"
    required: true
  slack-title:
    description: "Title of the Slack message"
    required: false
    default: "Notes for Sitoo Public release"
  current-tag:
    description: "Current tag"
    required: true
  previous-tag:
    description: "Previous tag"
    required: true
  github-token:
    description: "PAT with copilot-requests scope for Copilot CLI"
    required: true
  slack-token:
    description: "Slack Incoming Webhook Token"
    required: true
  slack-channel:
    description: "Slack channel to post the release notes to"
    required: true
  artifact-name:
    description: "Name of the uploaded release notes artifact"
    required: true

outputs:
  artifact-url:
    description: "URL to the uploaded release notes artifact"
    value: ${{ steps.artifact_url.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Inject tag context
      id: load_prompt
      shell: bash
      env:
        PROMPT_FILE_PATH: ${{ github.action_path }}/prompts/${{ inputs.target-name }}-release-notes.md
        INPUT_CURRENT_TAG: ${{ inputs.current-tag }}
        INPUT_PREVIOUS_TAG: ${{ inputs.previous-tag }}
      run: |
        set -euo pipefail

        {
          echo "content<<EOF"
          echo "INPUT_CURRENT_TAG=\"${INPUT_CURRENT_TAG:-}\""
          echo "INPUT_PREVIOUS_TAG=\"${INPUT_PREVIOUS_TAG:-}\""
          printf '\n'
          cat "$PROMPT_FILE_PATH"
          printf '\n'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run Copilot for release notes
      id: copilot
      uses: sitoo/mobile-shared-cicd/actions/copilot/cli-prompt@simplify_workflow
      env:
        INPUT_CURRENT_TAG: ${{ inputs.current-tag || '' }}
        INPUT_PREVIOUS_TAG: ${{ inputs.previous-tag || '' }}
      with:
        prompt-text: ${{ steps.load_prompt.outputs.content }}
        output-file: ${{ inputs.artifact-name }}.md
        github-token: ${{ inputs.github-token }}
        timeout: "600s"

    - name: Upload release notes artifact
      if: always()
      id: upload_release_notes
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-name }}.md
        if-no-files-found: error

    - name: Build artifact URL
      id: artifact_url
      shell: bash
      run: |
        set -euo pipefail

        BASE_URL="${{ github.server_url }}/${{ github.repository }}"
        RUN_PATH="/actions/runs/${{ github.run_id }}/artifacts"
        ARTIFACT_ID="${{ steps.upload_release_notes.outputs.artifact-id }}"
        ARTIFACT_URL="${BASE_URL}${RUN_PATH}/${ARTIFACT_ID}"

        echo "url=${ARTIFACT_URL}" >> "$GITHUB_OUTPUT"

    - name: Notify Slack with release notes link
      if: always()
      uses: slackapi/slack-github-action@v2.1.1
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        payload: |
          {
              "channel": "${{ inputs.slack-channel }}",
              "text": ":robot_face: ${{ inputs.slack-title }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":robot_face: *${{ inputs.slack-title }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n`${{ github.repository }}`" },
                    { "type": "mrkdwn", "text": "*Run:*\n#${{ github.run_number }}" },
                    { "type": "mrkdwn", "text": "*Artifact:*\n`${{ inputs.target-name }}-release-notes`" },
                    { "type": "mrkdwn", "text": "*URL:*\n${{ steps.artifact_url.outputs.url }}" }
                  ]
                }
              ]
          }
