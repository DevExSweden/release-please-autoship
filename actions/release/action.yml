name: "Copilot Release Notes"
description: "Generate release notes with GitHub Copilot, upload them as an artifact, and post a Slack link."

inputs:
  target-name:
    description: "Name of the target (e.g. sitoo, varner)"
    required: true
  current-tag:
    description: "Current tag"
    required: true
  previous-tag:
    description: "Previous tag"
    required: true
  github-token:
    description: "PAT with copilot-requests scope for Copilot CLI"
    required: true
  artifact-name:
    description: "Name of the uploaded release notes artifact"
    required: true
  

outputs:
  artifact-url:
    description: "URL to the uploaded release notes artifact"
    value: ${{ steps.artifact_url.outputs.url }}
  current-sha:
    description: "Commit SHA for the current release tag"
    value: ${{ steps.get_shas.outputs.current_sha }}
  base-sha:
    description: "Commit SHA for the base (previous) release tag"
    value: ${{ steps.get_shas.outputs.base_sha }}

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Get commit SHAs for tags
      id: get_shas
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/scripts/get_commit_shas.sh"
        "${{ github.action_path }}/scripts/get_commit_shas.sh" \
          "${{ inputs.current-tag }}" \
          "${{ inputs.previous-tag }}" \
          "${{ github.sha }}"

    - name: Inject commit context
      id: load_prompt
      shell: bash
      env:
        PROMPT_FILE_PATH: ${{ github.action_path }}/prompts/${{ inputs.target-name }}-release-notes.md
        CURRENT_SHA: ${{ steps.get_shas.outputs.current_sha }}
        BASE_SHA: ${{ steps.get_shas.outputs.base_sha }}
      run: |
        set -euo pipefail

        {
          echo "content<<EOF"
          echo "CURRENT_COMMIT_SHA=\"${CURRENT_SHA:-}\""
          echo "BASE_COMMIT_SHA=\"${BASE_SHA:-}\""
          printf '\n'
          cat "$PROMPT_FILE_PATH"
          printf '\n'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run Copilot for release notes
      id: copilot
      uses: sitoo/mobile-shared-cicd/actions/copilot/cli-prompt@main
      env:
        CURRENT_COMMIT_SHA: ${{ steps.get_shas.outputs.current_sha }}
        BASE_COMMIT_SHA: ${{ steps.get_shas.outputs.base_sha }}
      with:
        prompt-text: ${{ steps.load_prompt.outputs.content }}
        output-file: ${{ inputs.artifact-name }}.md
        github-token: ${{ inputs.github-token }}
        timeout: "600s"

    - name: Upload release notes artifact
      if: always()
      id: upload_release_notes
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-name }}.md
        if-no-files-found: error

    - name: Build artifact URL
      id: artifact_url
      shell: bash
      run: |
        set -euo pipefail

        BASE_URL="${{ github.server_url }}/${{ github.repository }}"
        RUN_PATH="/actions/runs/${{ github.run_id }}/artifacts"
        ARTIFACT_ID="${{ steps.upload_release_notes.outputs.artifact-id }}"
        ARTIFACT_URL="${BASE_URL}${RUN_PATH}/${ARTIFACT_ID}"

        echo "url=${ARTIFACT_URL}" >> "$GITHUB_OUTPUT"
