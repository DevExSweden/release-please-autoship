name: "Copilot CLI Prompt Runner"
description: "Run GitHub Copilot CLI with a prompt loaded from a file and write the result to an output file."

inputs:
  prompt-text:
    description: "Prompt text used as Copilot instructions"
    required: true
  output-file:
    description: "Path/filename for the generated Copilot output"
    required: false
    default: "copilot-output.md"
  github-token:
    description: "GitHub token (PAT) for Copilot CLI authentication"
    required: true
  timeout:
    description: "Timeout duration (e.g. 600s, 10m). Passed to the script's -t option."
    required: false
    default: "600s"

outputs:
  report:
    description: "Full text output generated by Copilot CLI"
    value: ${{ steps.copilot-run.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Install GitHub Copilot CLI (if needed)
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v copilot >/dev/null 2>&1; then
          echo "Copilot CLI not found. Installing..."
          npm install -g @github/copilot
        else
          echo "Copilot CLI already installed."
        fi

    - name: Run Copilot with prompt file
      id: copilot-run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROMPT_TEXT: ${{ inputs.prompt-text }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail

        bash "${{ github.action_path }}/scripts/run-copilot.sh" \
          -p "$PROMPT_TEXT" \
          -o "$OUTPUT_FILE" \
          -t "$TIMEOUT"
