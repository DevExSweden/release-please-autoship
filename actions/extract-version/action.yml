name: "Extract Version"
description: "Extract version from a JSON manifest file"

inputs:
  file-path:
    description: "Path to the JSON version file (e.g. .release-please-manifest.json)"
    required: true
  key:
    description: "JSON key to extract (e.g. '.')"
    required: false
    default: "."

outputs:
  version:
    description: "Extracted version string"
    value: ${{ steps.extract.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Extract version
      id: extract
      shell: bash
      run: |
        VERSION=$("${{ github.action_path }}/scripts/extract.sh" \
          "${{ inputs.file-path }}" \
          "${{ inputs.key }}")
        
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Extracted version: $VERSION"
