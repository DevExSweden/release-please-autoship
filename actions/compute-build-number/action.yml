name: "Compute Build Number"
description: "Compute monotonic build number based on git commit count"

inputs:
  build-number-base:
    description: "Base number for build number calculation"
    required: false
    default: "1000"

outputs:
  build-number:
    description: "Computed monotonic build number"
    value: ${{ steps.compute.outputs.build_number }}

runs:
  using: "composite"
  steps:
    - name: Compute build number
      id: compute
      shell: bash
      run: |
        "${{ github.action_path }}/scripts/compute-build-number.sh" \
          "${{ inputs.build-number-base }}"

