[project]
name = "upload-to-google-drive"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2",
  "google-api-python-client>=2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["--tb=short", "-q"]

[tool.coverage.run]
source = ["drive"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
