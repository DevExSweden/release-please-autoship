name: "Auto-merge PR"
description: "Approve and auto-merge a pull request using dual-identity pattern (App token creates/merges, GITHUB_TOKEN approves)"

inputs:
  pr-number:
    description: "The PR number to approve and merge"
    required: true
  github-app-token:
    description: "GitHub App token for enabling auto-merge"
    required: true
  merge-method:
    description: "Merge method: squash, merge, or rebase"
    required: false
    default: "squash"
  delete-branch:
    description: "Delete the branch after merge"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Approve PR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        echo "Auto-approving PR #${PR_NUMBER}"
        gh pr review "${PR_NUMBER}" --approve

    - name: Enable auto-merge
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-app-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        DELETE_BRANCH: ${{ inputs.delete-branch }}
      run: |
        ARGS="--${MERGE_METHOD}"
        if [[ "${DELETE_BRANCH}" == "true" ]]; then
          ARGS="${ARGS} --delete-branch"
        fi
        echo "Enabling auto-merge for PR #${PR_NUMBER} (${MERGE_METHOD})"
        if gh pr merge --auto ${ARGS} "${PR_NUMBER}"; then
          echo "Auto-merge enabled."
        else
          echo "Auto-merge not available (branch protection not configured), merging directly."
          gh pr merge ${ARGS} "${PR_NUMBER}"
        fi
