name: Reusable Create Release Branch

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Branch to create release from (e.g. develop)"
        required: true
        type: string

      version-file-path:
        description: "Path to the JSON version file (e.g. .github/.release-please-manifest.json)"
        required: true
        type: string

      version-key:
        description: "JSON key to extract (e.g. '.')"
        required: false
        type: string
        default: "."

      changelog-file-path:
        description: "Path to CHANGELOG.md (full changelog for this version will be uploaded to Slack on success)"
        required: false
        type: string
        default: "CHANGELOG.md"

      slack-channel-success:
        description: "Slack channel name for success notifications (e.g. releases)"
        required: true
        type: string

      slack-channel-failure:
        description: "Slack channel name for failure notifications (e.g. releases-alerts)"
        required: true
        type: string

      gh-app-id:
        description: "GitHub App ID for generating a token that triggers downstream workflows"
        required: false
        type: string
        default: ""

    secrets:
      SLACK_RELEASE_BOT_TOKEN:
        required: true
      GH_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        if: inputs.gh-app-id != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.gh-app-id }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Extract version from repo that Release Please just bumped
        id: version
        uses: sitoo/mobile-shared-cicd/actions/extract-version@main
        with:
          file-path: ${{ inputs.version-file-path }}
          key: ${{ inputs.version-key }}

      - name: Set version environment variables
        run: |
          echo "RELEASE_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=release-v${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Create release branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_BRANCH="release-v$VERSION"

          if git show-ref --quiet refs/remotes/origin/$RELEASE_BRANCH; then
            echo "Release branch already exists: $RELEASE_BRANCH"
            exit 0
          fi

          git checkout -b "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"

      - name: Extract changelog for version
        id: extract-changelog
        if: success()
        uses: sitoo/mobile-shared-cicd/actions/extract-changelog@main
        with:
          changelog-file-path: ${{ inputs.changelog-file-path }}
          version: ${{ steps.version.outputs.version }}

      - name: Notify Slack (with changelog file)
        if: success()
        uses: sitoo/mobile-shared-cicd/actions/slack-upload-file@main
        with:
          slack_token: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
          channel: ${{ inputs.slack-channel-success }}
          file_path: ${{ steps.extract-changelog.outputs.file }}
          file_name: "CHANGELOG-v${{ steps.version.outputs.version }}.md"
          title: "Release v${{ steps.version.outputs.version }} Changelog"
          initial_comment: |
            ✅ Release Branch for v${{ steps.version.outputs.version }} Ready
            From: ${{ inputs.target-branch }}
            Release Branch: release-v${{ steps.version.outputs.version }}
            Repository: ${{ github.repository }}
            Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Next: Full changelog attached as file.

      - name: Notify Slack (failure only)
        if: failure()
        uses: sitoo/mobile-shared-cicd/actions/slack-status-notification@main
        with:
          status: ${{ job.status }}
          channel: ${{ inputs.slack-channel-failure }}
          failure-title: "Release Preparation Failed for version ${{ steps.version.outputs.version }}"
          fields: |
            {
              "From": "${{ inputs.target-branch }}",
              "Release Branch": "not created",
              "Version": "${{ steps.version.outputs.version }}",
              "Repository": "${{ github.repository }}",
              "Details": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          failure-footer: "Action: Check the workflow run, fix issues, and retry."
          slack-token: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
