name: PR YAML & Action Linter
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.'
          config_file: '.yamllint.yml'

      - name: Run actionlint
        uses: raven-actions/actionlint@v2.1.1

  test-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changes in actions
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            actions:
              - 'actions/**'
            markdown_to_notion:
              - 'actions/markdown-to-notion/**'
            publish_to_notion_db:
              - 'actions/publish-to-notion-db/**'
            notion_to_pdf:
              - 'actions/notion-to-pdf/**'
            slack_upload_file:
              - 'actions/slack-upload-file/**'
            email_release_notification:
              - 'actions/email-release-notification/**'

      - name: Setup Node.js
        if: steps.changes.outputs.actions == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            actions/markdown-to-notion/package-lock.json
            actions/publish-to-notion-db/package-lock.json
            actions/notion-to-pdf/package-lock.json
            actions/slack-upload-file/package-lock.json

      - name: Test markdown-to-notion action
        if: steps.changes.outputs.markdown_to_notion == 'true'
        run: |
          cd actions/markdown-to-notion
          npm ci
          npm test

      - name: Test publish-to-notion-db action
        if: steps.changes.outputs.publish_to_notion_db == 'true'
        run: |
          cd actions/publish-to-notion-db
          npm ci
          npm test
          
      - name: Test notion-to-pdf action
        if: steps.changes.outputs.notion_to_pdf == 'true'
        run: |
          cd actions/notion-to-pdf
          npm ci
          npm test

      - name: Test slack-upload-file action
        if: steps.changes.outputs.slack_upload_file == 'true'
        run: |
          cd actions/slack-upload-file
          npm ci
          npm test

      - name: Set up uv
        if: steps.changes.outputs.email_release_notification == 'true'
        uses: astral-sh/setup-uv@c0b7f63f921ff91255da381cfafb949f89803448
        with:
          python-version: "3.11"

      - name: Test email-release-notification action
        if: steps.changes.outputs.email_release_notification == 'true'
        run: |
          cd actions/email-release-notification
          uv run --group dev pytest --cov --cov-report=term-missing
