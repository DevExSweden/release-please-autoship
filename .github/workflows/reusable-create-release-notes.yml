name: Copilot Create Release Notes Workflow

on:
  workflow_call:
    inputs:
      current_tag:
        description: "Current release tag (optional). If omitted, version is read from version-file-path."
        required: false
        type: string
      previous_tag:
        description: "Previous release tag (optional)"
        required: false
        type: string
      version-file-path:
        description: "Path to the JSON manifest file used to extract the version when current_tag is not provided"
        required: false
        type: string
        default: ".github/release-please/manifest.json"
      version-key:
        description: "JSON key to extract from the manifest file (e.g. '.')"
        required: false
        type: string
        default: "."
      platform:
        description: "Platform (iOS or Android)"
        required: true
        type: string
    secrets:
      COPILOT_CI_PAT:
        required: true
      POS_RELEASE_BOT_TOKEN:
        required: true
      NOTION_RELEASE_API_TOKEN:
        required: true
      NOTION_RELEASE_NOTES_DB:
        required: true

permissions:
  contents: read

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    outputs:
      trimmed-version: ${{ steps.trim_version.outputs.trimmedVersion }}
    strategy:
      matrix:
        target:
          - name: sitoo
            context: "Release Notes for Sitoo Public"
            audience: "Sitoo Public"
            artifact-name: "release-notes-sitoo-public"
          - name: varner
            context: "Release Notes for Varner"
            audience: "Varner"
            artifact-name: "release-notes-varner"

    steps:
      - uses: sitoo/mobile-shared-cicd/actions/release@main
        id: release_notes
        with:
          current-tag: ${{ inputs.current_tag }}
          previous-tag: ${{ inputs.previous_tag }}
          target-name: ${{ matrix.target.name }}
          github-token: ${{ secrets.COPILOT_CI_PAT }}
          artifact-name: ${{ matrix.target.artifact-name }}

      - name: Get current time
        id: now
        run: echo "now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Download the release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target.artifact-name }}
          path: ./release-notes/

      - name: Read release notes content
        id: read_notes
        run: |
          file=$(find ./release-notes -name "*.md" -type f | head -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            cat "$file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Convert Markdown to Notion blocks
        id: notion_blocks
        uses: sitoo/mobile-shared-cicd/actions/markdown-to-notion@main
        with:
          markdown_path: ${{ steps.read_notes.outputs.file }}

      - name: Extract version from manifest
        id: extract_version
        if: inputs.current_tag == '' && inputs.version-file-path != ''
        uses: sitoo/mobile-shared-cicd/actions/extract-version@main
        with:
          file-path: ${{ inputs.version-file-path }}
          key: ${{ inputs.version-key }}

      - name: Resolve version
        id: trim_version
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ inputs.current_tag != '' && inputs.current_tag || steps.extract_version.outputs.version }}'
          if [[ "$raw" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "trimmedVersion=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "trimmedVersion=$raw" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Notion DB
        uses: sitoo/mobile-shared-cicd/actions/publish-to-notion-db@main
        with:
          notion_token: ${{ secrets.NOTION_RELEASE_API_TOKEN }}
          notion_database_id: ${{ secrets.NOTION_RELEASE_NOTES_DB }}
          title_property_name: "Name"
          title: "${{ steps.trim_version.outputs.trimmedVersion }} Release Notes"

          properties_json: >
            {
              "Version": {
                "rich_text": [
                  {
                    "type": "text",
                    "text": { "content": "${{ steps.trim_version.outputs.trimmedVersion }}" }
                  }
                ]
              },
              "Created At": {
                "date": { "start": "${{ steps.now.outputs.now }}" }
              },
              "GitHub URL": {
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              "Platform": {
                "select": { "name": "${{ inputs.platform }}" }
              },
              "Target": {
                "select": { "name": "${{ matrix.target.audience }}" }
              },
              "Status": {
                "select": { "name": "Draft" }
              },
              "Current Commit": {
                "rich_text": [
                  {
                    "type": "text",
                    "text": {
                      "content": "${{ steps.release_notes.outputs.current-sha }}"
                    }
                  }
                ]
              },
              "Base Commit": {
                "rich_text": [
                  {
                    "type": "text",
                    "text": {
                      "content": "${{ steps.release_notes.outputs.base-sha }}"
                    }
                  }
                ]
              }
            }
          body: ${{ steps.notion_blocks.outputs.blocks_json }}

  notify-slack:
    needs: [generate-release-notes]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack with release notes link
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.POS_RELEASE_BOT_TOKEN }}
          payload: |
            {
                "channel": ${{vars.RELEASE_NOTES_SLACK_CHANNEL}},
                "text": ":white_check_mark: Release Notes ready for review",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": ":white_check_mark: *Release Notes Ready for Review*"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Version:*\n`${{ needs.generate-release-notes.outputs.trimmed-version }}`" },
                      { "type": "mrkdwn", "text": "*Platform:*\n`${{ inputs.platform }}`" },
                      { "type": "mrkdwn", "text": "*Repository:*\n`${{ github.repository }}`" },
                      { "type": "mrkdwn", "text": "*Notion:*\n<${{ vars.RELEASE_NOTES_URL }}|View Release Notes>" }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>"
                      }
                    ]
                  }
                ]
            }

  notify-slack-failure:
    if: failure()
    needs: [generate-release-notes]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.POS_RELEASE_BOT_TOKEN }}
          payload: |
            {
                "channel": "${{ vars.RELEASE_NOTES_SLACK_CHANNEL }}",
                "text": ":x: Release Notes generation failed for ${{ needs.generate-release-notes.outputs.trimmed-version }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": ":x: *Release Notes Generation Failed*"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Version:*\n`${{ needs.generate-release-notes.outputs.trimmed-version }}`" },
                      { "type": "mrkdwn", "text": "*Platform:*\n`${{ inputs.platform }}`" },
                      { "type": "mrkdwn", "text": "*Repository:*\n`${{ github.repository }}`" },
                      { "type": "mrkdwn", "text": "*Status:*\n:warning: Failed" }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>"
                      }
                    ]
                  }
                ]
            }
