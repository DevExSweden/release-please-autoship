name: Reusable Release Please

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Branch to run Release Please on (e.g. develop)"
        required: true
        type: string

      pos-release-bot-app-id:
        description: "GitHub App ID for the POS Release Bot"
        required: true
        type: string

      config-file:
        description: "Path to release-please config file"
        required: false
        type: string
        default: ".github/release-please-config.json"

      manifest-file:
        description: "Path to release-please manifest file"
        required: false
        type: string
        default: ".github/.release-please-manifest.json"

    secrets:
      GH_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref_name == inputs.target-branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Release Please with auto-merge
        id: release
        uses: sitoo/mobile-shared-cicd/actions/release-please-automerge@main
        with:
          target-branch: ${{ inputs.target-branch }}
          github-app-id: ${{ inputs.pos-release-bot-app-id }}
          github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
