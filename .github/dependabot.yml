version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /actions/markdown-to-notion
    schedule:
      interval: weekly
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /actions/notion-to-pdf
    schedule:
      interval: weekly
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /actions/publish-to-notion-db
    schedule:
      interval: weekly
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /actions/slack-upload-file
    schedule:
      interval: weekly
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
